name: Bug report
description: Something on the page does not work the way the README says.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach an export, a backup, or a screenshot that shows your own health data. Issues are public. To show the problem, use the sample (Data, then Load sample data) or the zips in `test/fixtures/`.

        A security problem goes to the [private reporting page](https://github.com/glassbody-app/glassbody-app.github.io/security/advisories/new) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: From opening the page to the problem.
      placeholder: |
        1. Open https://glassbody-app.github.io/
        2. Load the sample
        3. ...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Safari 27.2
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS
      placeholder: iPhone, iOS 27.2
    validations:
      required: true
  - type: dropdown
    id: installed
    attributes:
      label: Installed app or browser tab
      options:
        - Browser tab
        - Installed app (from the Home Screen, or installed from Chrome or Edge)
        - Not sure
    validations:
      required: true
  - type: input
    id: export
    attributes:
      label: Health Auto Export version, and the export's format and aggregation
      description: Leave it empty if the problem has nothing to do with importing.
      placeholder: version, CSV, Sum
  - type: checkboxes
    id: no-health-data
    attributes:
      label: Health data
      options:
        - label: This issue contains none of my own health data.
          required: true
